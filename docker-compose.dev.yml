services:
  postgres:
    image: postgres:16-alpine
    container_name: jagalog-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jagalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jagalogdevpass}
      POSTGRES_DB: ${POSTGRES_DB:-jagalog}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jagalog} -d ${POSTGRES_DB:-jagalog}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jagalog-redis-dev
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-jagalogdevredis}
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-jagalogdevredis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
